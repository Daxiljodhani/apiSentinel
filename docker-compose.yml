version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: api-sentinel-db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinelpassword
      POSTGRES_DB: api_sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d api_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api-sentinel-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-sentinel-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://sentinel:sentinelpassword@postgres:5432/api_sentinel?schema=public"
      JWT_SECRET: "prod_api_sentinel_jwt_secret_key"
      JWT_REFRESH_SECRET: "prod_api_sentinel_refresh_secret"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-sentinel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
